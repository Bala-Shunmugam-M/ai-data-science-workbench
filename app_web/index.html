<style>
:root{
  --paper:#F3F1E9; --card:#FBFAF3; --rail:#ECE8DC;
  --ink:#1C2A2B; --muted:#6C7574; --faint:#DED9CD;
  --contour:#2E6E63; --contour-soft:#4E8C81; --survey:#C25A2E;
  --ok:#3F7D53; --warn:#B7791F; --crit:#B23A48;
  --pos:#2E6E63; --neg:#C25A2E;
  --shadow:0 1px 2px rgba(28,42,43,.06),0 8px 24px rgba(28,42,43,.05);
  --ring:rgba(46,110,99,.45);
  --sans:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14201F; --card:#1B2A28; --rail:#101A19;
    --ink:#E9E7DC; --muted:#93A09C; --faint:#26332F;
    --contour:#5FB0A1; --contour-soft:#3E6E66; --survey:#E08A54;
    --ok:#5DAE77; --warn:#D9A441; --crit:#D9707C;
    --pos:#5FB0A1; --neg:#E08A54;
    --shadow:0 1px 2px rgba(0,0,0,.30),0 10px 28px rgba(0,0,0,.28);
    --ring:rgba(95,176,161,.5);
  }
}
:root[data-theme="light"]{
  --paper:#F3F1E9; --card:#FBFAF3; --rail:#ECE8DC;
  --ink:#1C2A2B; --muted:#6C7574; --faint:#DED9CD;
  --contour:#2E6E63; --contour-soft:#4E8C81; --survey:#C25A2E;
  --ok:#3F7D53; --warn:#B7791F; --crit:#B23A48;
  --pos:#2E6E63; --neg:#C25A2E;
  --shadow:0 1px 2px rgba(28,42,43,.06),0 8px 24px rgba(28,42,43,.05);
  --ring:rgba(46,110,99,.45);
}
:root[data-theme="dark"]{
  --paper:#14201F; --card:#1B2A28; --rail:#101A19;
  --ink:#E9E7DC; --muted:#93A09C; --faint:#26332F;
  --contour:#5FB0A1; --contour-soft:#3E6E66; --survey:#E08A54;
  --ok:#5DAE77; --warn:#D9A441; --crit:#D9707C;
  --pos:#5FB0A1; --neg:#E08A54;
  --shadow:0 1px 2px rgba(0,0,0,.30),0 10px 28px rgba(0,0,0,.28);
  --ring:rgba(95,176,161,.5);
}

*{box-sizing:border-box}
.wb{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;
  font-size:15px;
}
#contour{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;}
.shell{position:relative; z-index:1; display:grid; grid-template-columns:240px 1fr; min-height:100vh;}

/* ---- RAIL ---- */
.rail{
  position:sticky; top:0; height:100vh; overflow-y:auto;
  background:color-mix(in srgb,var(--rail) 88%,transparent);
  backdrop-filter:blur(6px);
  border-right:1px solid var(--faint);
  display:flex; flex-direction:column; padding:20px 14px 24px;
}
.wordmark{display:flex; flex-direction:column; gap:2px; padding:4px 8px 16px; text-decoration:none; color:inherit;}
.wordmark .glyph{font-family:var(--mono); font-size:11px; letter-spacing:.24em; color:var(--contour); text-transform:uppercase;}
.wordmark .name{font-size:19px; font-weight:650; letter-spacing:-.01em;}
.wordmark .sub{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.02em;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav-label{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); padding:14px 8px 6px;}
.navitem{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; cursor:pointer; color:var(--ink);
  font-family:var(--sans); font-size:13.5px; padding:8px 8px; border-radius:7px;
  transition:background .15s ease,color .15s ease;
}
.navitem:hover{background:color-mix(in srgb,var(--contour) 12%,transparent);}
.navitem .idx{
  font-family:var(--mono); font-size:11px; width:20px; height:20px; flex:none;
  display:grid; place-items:center; border:1px solid var(--faint); border-radius:5px;
  color:var(--muted); font-variant-numeric:tabular-nums;
}
.navitem .tx{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.navitem.active{background:var(--contour); color:#F3F1E9;}
:root[data-theme="dark"] .navitem.active, .navitem.active{color:#F5F3EC;}
.navitem.active .idx{border-color:transparent; background:rgba(255,255,255,.16); color:#fff;}
.navitem.star .mk{color:var(--survey); font-size:13px;}
.navitem.star.active .mk{color:#fff;}
.navitem.star{font-weight:600;}
.rail-div{height:1px; background:var(--faint); margin:12px 6px;}
.rail-foot{margin-top:auto; padding:14px 8px 0; font-family:var(--mono); font-size:10px; color:var(--muted); line-height:1.5;}

/* ---- MAIN ---- */
.main{min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 28px; border-bottom:1px solid var(--faint);
  background:color-mix(in srgb,var(--paper) 86%,transparent); backdrop-filter:blur(8px);
}
.topbar .tt{display:flex; flex-direction:column; margin-right:auto; min-width:0;}
.topbar .tt .k{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--survey);}
.topbar .tt .c{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.01em;}
.chip{
  font-family:var(--mono); font-size:11px; padding:5px 10px; border-radius:999px;
  border:1px solid var(--faint); color:var(--ink); display:inline-flex; align-items:center; gap:7px;
  white-space:nowrap; font-variant-numeric:tabular-nums;
}
.chip .dot{width:7px; height:7px; border-radius:50%; background:var(--contour);}
.chip.champ .dot{background:var(--survey);}
.ttoggle{
  font-family:var(--mono); font-size:11px; cursor:pointer; border:1px solid var(--faint);
  background:var(--card); color:var(--ink); padding:6px 11px; border-radius:7px; display:inline-flex; gap:7px; align-items:center;
  transition:border-color .15s ease;
}
.ttoggle:hover{border-color:var(--contour);}
.content{padding:26px 28px 60px; max-width:1120px; width:100%;}

/* ---- shared type ---- */
h1,h2,h3{text-wrap:balance; margin:0; letter-spacing:-.012em; font-weight:640;}
.view-head{margin-bottom:22px;}
.view-head .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--contour); display:flex; align-items:center; gap:10px;}
.view-head .eyebrow .n{color:var(--survey);}
.view-head h1{font-size:clamp(24px,3.4vw,34px); margin-top:8px;}
.view-head p{color:var(--muted); max-width:66ch; margin-top:8px; font-size:15px;}
.prose{max-width:66ch;}
.mono{font-family:var(--mono);}
.tnum{font-variant-numeric:tabular-nums;}
.lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);}

/* ---- cards / grids ---- */
.card{background:var(--card); border:1px solid var(--faint); border-radius:12px; box-shadow:var(--shadow);}
.pad{padding:18px;}
.grid{display:grid; gap:16px;}
.kpirow{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
.kpi{background:var(--card); border:1px solid var(--faint); border-radius:11px; padding:14px 15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:5px;}
.kpi .v{font-family:var(--mono); font-size:24px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
.kpi .v.accent{color:var(--survey);}
.kpi .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);}
.kpi .sub{font-size:11.5px; color:var(--muted);}

.stagemap{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px;}
.stagecard{background:var(--card); border:1px solid var(--faint); border-radius:11px; padding:15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;}
.stagecard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--contour); opacity:.5;}
.stagecard .snum{font-family:var(--mono); font-size:11px; color:var(--survey); letter-spacing:.08em;}
.stagecard h3{font-size:15px;}
.stagecard p{font-size:12.5px; color:var(--muted); line-height:1.5;}
.stagecard .out{font-family:var(--mono); font-size:10.5px; color:var(--contour); border-top:1px dashed var(--faint); padding-top:8px; margin-top:auto;}

.section-title{display:flex; align-items:baseline; gap:12px; margin:26px 0 12px;}
.section-title h2{font-size:19px;}
.section-title .hint{font-family:var(--mono); font-size:11px; color:var(--muted);}

/* champion card */
.champ-card{display:grid; grid-template-columns:1.1fr 1fr; gap:0; overflow:hidden;}
.champ-card .l{padding:20px; border-right:1px solid var(--faint);}
.champ-card .l .badge{display:inline-flex; gap:8px; align-items:center; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--survey);}
.champ-card .l h2{font-size:26px; margin:10px 0 4px;}
.champ-card .l .meta{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
.champ-card .r{padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; align-content:start;}
.metric{display:flex; flex-direction:column; gap:2px;}
.metric .mv{font-family:var(--mono); font-size:20px; font-weight:600; font-variant-numeric:tabular-nums;}
.metric .mv.accent{color:var(--survey);}
.metric .mk{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}

/* tables */
.tablewrap{overflow-x:auto; border:1px solid var(--faint); border-radius:11px; background:var(--card); box-shadow:var(--shadow);}
table{border-collapse:collapse; width:100%; font-size:13px;}
th,td{text-align:left; padding:10px 13px; border-bottom:1px solid var(--faint); white-space:nowrap;}
thead th{font-family:var(--mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:500;}
tbody tr:last-child td{border-bottom:0;}
td.num,th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums;}
tr.champrow{background:color-mix(in srgb,var(--survey) 9%,transparent);}
tr.champrow td:first-child{position:relative;}
td .fname{font-family:var(--mono); font-size:12px;}
td .formula{font-family:var(--mono); font-size:11.5px; color:var(--muted);}
.grp{font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:5px; border:1px solid var(--faint); color:var(--muted);}

/* stamp + chip */
.stamp{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ok); border:1.5px solid var(--ok); border-radius:5px; padding:2px 7px;
  transform:rotate(-6deg); font-weight:600; opacity:.9;
}
.qchip{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1px dashed var(--faint); border-radius:5px; padding:3px 8px;}

/* status banner */
.banner{display:flex; gap:12px; align-items:flex-start; border-radius:11px; padding:14px 16px; border:1px solid var(--faint); background:var(--card); box-shadow:var(--shadow);}
.banner .ic{width:9px; height:9px; border-radius:50%; margin-top:6px; flex:none;}
.banner.warn .ic{background:var(--warn);} .banner.ok .ic{background:var(--ok);}
.banner .bt{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
.banner .bd{font-size:13.5px; margin-top:2px;}

/* decision list */
.decision{display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--faint);}
.decision:last-child{border-bottom:0;}
.decision .dn{font-family:var(--mono); font-size:11px; color:var(--survey); flex:none; width:26px; font-variant-numeric:tabular-nums;}
.decision .dd h3{font-size:14.5px; margin-bottom:4px;}
.decision .dd p{font-size:13px; color:var(--muted); max-width:70ch;}

/* diverging bars */
.bars{display:flex; flex-direction:column; gap:7px;}
.bar-row{display:grid; grid-template-columns:150px 1fr 76px; align-items:center; gap:10px;}
.bar-row .bl{font-size:12px; text-align:right; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{position:relative; height:16px;}
.bar-track::before{content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--faint);}
.bar-fill{position:absolute; top:2px; height:12px; border-radius:3px; transition:width .32s cubic-bezier(.22,.61,.36,1), left .32s cubic-bezier(.22,.61,.36,1);}
.bar-fill.pos{background:var(--pos);}
.bar-fill.neg{background:var(--neg);}
.bar-row .bv{font-family:var(--mono); font-size:11.5px; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted);}

/* ---- PREDICTOR ---- */
.pred-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,420px); gap:20px; align-items:start;}
.controls .field{padding:11px 0; border-bottom:1px solid var(--faint);}
.controls .field:last-child{border-bottom:0;}
.field .frow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px;}
.field label{font-size:13px; font-weight:520;}
.field .num{font-family:var(--mono); font-size:13px; width:96px; text-align:right; padding:4px 8px; border:1px solid var(--faint); border-radius:6px; background:var(--paper); color:var(--ink); font-variant-numeric:tabular-nums;}
.field input[type=range]{width:100%; accent-color:var(--contour); height:20px;}
.seg{display:flex; flex-wrap:wrap; gap:6px;}
.seg button{font-family:var(--mono); font-size:11px; padding:6px 10px; border:1px solid var(--faint); background:var(--paper); color:var(--muted); border-radius:7px; cursor:pointer; transition:all .14s ease;}
.seg button.on{background:var(--contour); color:#F3F1E9; border-color:transparent;}
.seg button:hover{border-color:var(--contour);}
.presets{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.presets button{font-family:var(--sans); font-size:12px; padding:7px 12px; border:1px solid var(--faint); background:var(--card); color:var(--ink); border-radius:8px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .14s ease;}
.presets button:hover{border-color:var(--survey);}

.readout{position:sticky; top:74px;}
.readout .plate{padding:22px; text-align:center; border-bottom:1px solid var(--faint);}
.readout .plate .cap0{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
.readout .plate .value{font-family:var(--mono); font-size:clamp(38px,7vw,52px); font-weight:650; color:var(--survey); letter-spacing:-.02em; line-height:1.05; margin:8px 0 6px; font-variant-numeric:tabular-nums;}
.readout .plate .cap{font-size:12.5px; color:var(--muted); max-width:34ch; margin:0 auto;}
.readout .chart{padding:16px 18px;}
.readout .chart .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; display:flex; justify-content:space-between;}
.caveat{margin-top:16px; font-size:12px; color:var(--muted); border:1px dashed var(--faint); border-radius:10px; padding:12px 14px; line-height:1.55;}
.caveat b{color:var(--ink); font-weight:600;}

/* footer note */
.footnote{margin-top:40px; padding-top:18px; border-top:1px solid var(--faint); font-size:12.5px; color:var(--muted); max-width:80ch; line-height:1.6;}
.footnote b{color:var(--ink);}

/* views */
.view{display:none;}
.view.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

:focus-visible{outline:2px solid var(--ring); outline-offset:2px; border-radius:4px;}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;}
  .rail{position:sticky; top:0; height:auto; flex-direction:column; padding:10px 12px;}
  .wordmark{padding:2px 6px 8px;}
  .nav{flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px;}
  .nav-label{display:none;}
  .rail-div{display:none;}
  .rail-foot{display:none;}
  .navitem{white-space:nowrap; padding:7px 10px;}
  .navitem .tx{white-space:nowrap;}
  .nav.secondary{margin-top:2px;}
  .pred-grid{grid-template-columns:1fr;}
  .champ-card{grid-template-columns:1fr;}
  .champ-card .l{border-right:0; border-bottom:1px solid var(--faint);}
  .readout{position:static;}
  .content{padding:20px 16px 48px;}
  .topbar{padding:10px 16px;}
  .bar-row{grid-template-columns:120px 1fr 64px;}
}
@media (prefers-reduced-motion:reduce){
  .view.active{animation:none;}
  .bar-fill{transition:none;}
}
</style>

<script>
(function(){
"use strict";
const spec = DATA.spec, meta = DATA.meta, champ = DATA.champion;
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------- number helpers ---------- */
const dollar = v => "$" + Math.round(v).toLocaleString("en-US");
const comma = v => Math.round(v).toLocaleString("en-US");
const fx = (v,d=0)=> Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- friendly labels ---------- */
const LBL = {
  median_income:"Median income", latitude:"Latitude (N&ndash;S)", longitude:"Longitude (E&ndash;W)",
  log_population:"Population (log)", log_total_rooms:"Total rooms (log)", log_total_bedrooms:"Total bedrooms (log)",
  log_households:"Households (log)", housing_median_age:"Housing age", households:"Households",
  population:"Population", total_rooms:"Total rooms", total_bedrooms:"Total bedrooms",
  rooms_per_household:"Rooms / household", bedrooms_per_room:"Bedroom share of rooms",
  population_per_household:"People / household", bedrooms_per_household:"Bedrooms / household",
  rooms_per_person:"Rooms / person", bedrooms_per_person:"Bedrooms / person",
  "ocean_proximity_<1H OCEAN":"Within 1h of ocean", "ocean_proximity_INLAND":"Inland location",
  "ocean_proximity_ISLAND":"Island", "ocean_proximity_NEAR BAY":"Near bay", "ocean_proximity_NEAR OCEAN":"Near ocean"
};
const friendly = k => LBL[k] || k;

/* ---------- CORE: prediction (verified to match scikit-learn) ---------- */
function engineer(raw){
  const e = Object.assign({}, raw);
  for(const k in spec.ratio_features){
    const pair = spec.ratio_features[k], den = raw[pair[1]];
    e[k] = (den===0) ? NaN : raw[pair[0]]/den;
  }
  for(const k in spec.log_features){
    e[k] = Math.log1p(raw[spec.log_features[k]]);
  }
  return e;
}
function predict(raw){
  const e = engineer(raw);
  let pred = spec.intercept;
  const contribs = [];
  spec.numeric_columns.forEach(col=>{
    let v = e[col];
    if(v===undefined || v===null || Number.isNaN(v)) v = spec.medians[col];
    const z = (v - spec.means[col]) / spec.stds[col];
    const c = z * spec.coef[col];
    pred += c;
    contribs.push({key:col, contribution:c});
  });
  spec.categorical_columns.forEach(col=>{
    spec.categories[col].forEach(lvl=>{
      const key = col + "_" + lvl;
      const hot = (raw[col]===lvl) ? 1 : 0;
      const c = hot * spec.coef[key];
      pred += c;
      if(hot) contribs.push({key:key, contribution:c});
    });
  });
  return {pred, contribs};
}

/* ---------- diverging bars ---------- */
function renderBars(container, items, opts){
  opts = opts || {};
  const maxAbs = Math.max.apply(null, items.map(i=>Math.abs(i.value))) || 1;
  container.innerHTML = "";
  items.forEach(it=>{
    const pct = Math.abs(it.value)/maxAbs*50; // half-width max
    const pos = it.value >= 0;
    const row = document.createElement("div");
    row.className = "bar-row";
    const disp = opts.dollar ? (pos?"+":"&minus;")+dollar(Math.abs(it.value)).slice(1) : (pos?"+":"&minus;")+comma(Math.abs(it.value));
    row.innerHTML =
      '<div class="bl" title="'+(it.title||it.label)+'">'+it.label+'</div>'+
      '<div class="bar-track"><div class="bar-fill '+(pos?"pos":"neg")+'"></div></div>'+
      '<div class="bv tnum">'+disp+'</div>';
    container.appendChild(row);
    const fill = row.querySelector(".bar-fill");
    const set = ()=>{ if(pos){ fill.style.left="50%"; fill.style.width=pct+"%"; } else { fill.style.left=(50-pct)+"%"; fill.style.width=pct+"%"; } };
    if(RM){ set(); } else { fill.style.left="50%"; fill.style.width="0%"; requestAnimationFrame(()=>requestAnimationFrame(set)); }
  });
}

/* =========================================================
   VIEW BUILDERS  (return HTML strings; hydrate afterwards)
   ========================================================= */
function head(eyebrow, n, title, desc){
  return '<div class="view-head"><div class="eyebrow">'+(n?'<span class="n">'+n+'</span>':'')+'<span>'+eyebrow+'</span></div>'+
    '<h1>'+title+'</h1>'+(desc?'<p>'+desc+'</p>':'')+'</div>';
}

/* ---- Dashboard ---- */
function vDashboard(){
  let h = head("Model defence &middot; live build", "", "A governed instrument for valuing California housing districts",
    "Every stage below is an inspectable record of how the champion model was produced &mdash; and the Predictor is that model, running live in your browser.");
  // KPI row
  const kpis = [
    ["20,640","Census rows","harrywang/housing"],
    ["14,448 / 3,096 / 3,096","Train / val / test","stratified on income, seed 42"],
    ["10","Approved features","6 ratios + 4 log transforms"],
    ["3","Linear models trained","Ridge &middot; Lasso &middot; LinearRegression"],
    ["0.667","Champion test R&sup2;","held-out, measured once", true]

let lastPred = null;
function recompute(){
  const {pred, contribs} = predict(state);
  // count-up
  const el = document.getElementById("predValue");
  if(el){
    if(RM || lastPred===null){ el.textContent = dollar(pred); }
    else countUp(el, lastPred, pred, 300);
    lastPred = pred;
  }
  // bars: top 10 by abs contribution
  const sorted = contribs.slice().sort((a,b)=>Math.abs(b.contribution)-Math.abs(a.contribution)).slice(0,10);
  const bars = document.getElementById("predBars");
  if(bars) renderBars(bars, sorted.map(c=>({label:friendly(c.key), title:friendly(c.key), value:c.contribution})), {dollar:true});
}
let animToken = 0;
function countUp(el, from, to, dur){
  const my = ++animToken;
  const t0 = performance.now();
  function frame(t){
    if(my !== animToken) return;            // a newer value superseded this animation
    let p = Math.min(1,(t-t0)/dur);
    p = 1-Math.pow(1-p,3);
    el.textContent = dollar(from + (to-from)*p);
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // robustness: guarantee the final value lands even if rAF is throttled/paused
  setTimeout(()=>{ if(my === animToken) el.textContent = dollar(to); }, dur+50);
}

function hydratePredictor(){
  SLIDERS.forEach(s=>{
    const key=s[0];
    const sl=document.getElementById("s_"+key), nm=document.getElementById("n_"+key);
    const r=spec.ui_ranges[key];
    const sync=(v,fromNum)=>{
      let val=parseFloat(v);
      if(Number.isNaN(val)) return;
      val=Math.min(r.max,Math.max(r.min,val));
      state[key]=val;
      if(fromNum) sl.value=val; else nm.value=val;
      recompute();
    };
    sl.addEventListener("input",e=>sync(e.target.value,false));
    nm.addEventListener("input",e=>{ state[key]=Math.min(r.max,Math.max(r.min,parseFloat(e.target.value)||r.min)); sl.value=state[key]; recompute(); });
    nm.addEventListener("change",e=>{ sl.value=Math.min(r.max,Math.max(r.min,parseFloat(e.target.value)||r.min)); nm.value=sl.value; state[key]=parseFloat(sl.value); recompute(); });
  });
  const seg=document.getElementById("oceanSeg");
  function paintOcean(){ seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.ocean===state.ocean_proximity)); }
  seg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.ocean_proximity=b.dataset.ocean; paintOcean(); recompute(); });
  paintOcean();
  // presets
  document.querySelectorAll("[data-preset]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const p=btn.dataset.preset;
      if(p==="median"){ resetState(); }
      else if(p==="coastal"){ resetState(); state.ocean_proximity="NEAR OCEAN"; state.median_income=5.0; state.longitude=-122.20; state.latitude=37.40; state.housing_median_age=32; }
      else if(p==="inland"){ resetState(); state.ocean_proximity="INLAND"; state.median_income=2.5; state.longitude=-120.10; state.latitude=36.60; state.housing_median_age=22; }
      syncAll(); paintOcean(); recompute();
    });
  });
  function syncAll(){ SLIDERS.forEach(s=>{ const k=s[0]; const sl=document.getElementById("s_"+k), nm=document.getElementById("n_"+k); if(sl){sl.value=state[k]; nm.value=state[k];} }); }
  lastPred=null;
  recompute();
}

  const root=document.documentElement;
  function cur(){ return root.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"); }
  function paint(){ const d=cur()==="dark"; ic.textContent=d?"\u263E":"\u2600"; tx.textContent=d?"Dark":"Light"; }
  btn.addEventListener("click",()=>{ root.setAttribute("data-theme", cur()==="dark"?"light":"dark"); paint(); drawContour(); });
  paint();
})();

/* ---------- contour background ---------- */
const cv=document.getElementById("contour");
function drawContour(){
  const ctx=cv.getContext("2d");
  const w=cv.width=window.innerWidth, h=cv.height=window.innerHeight;
  ctx.clearRect(0,0,w,h);
  const styles=getComputedStyle(document.documentElement);
  const col=styles.getPropertyValue("--contour").trim() || "#2E6E63";
  ctx.lineWidth=1;
  // two peaks -> nested wavy contours
  const peaks=[{x:w*0.22,y:h*0.30,a:26,k:5,ph:0.6},{x:w*0.82,y:h*0.72,a:34,k:6,ph:2.1}];
  const rings=13, stepR=Math.max(w,h)/16;
  const drawUpTo = RM ? rings : 0;
  function ring(peak, idx){
    const base=stepR*(idx+1);
    ctx.beginPath();
    for(let t=0;t<=Math.PI*2+0.02;t+=0.07){
      const rad=base + Math.sin(t*peak.k+peak.ph)*peak.a*(1+idx*0.12) + Math.cos(t*(peak.k+2)+idx)*peak.a*0.4;
      const x=peak.x+Math.cos(t)*rad, y=peak.y+Math.sin(t)*rad*0.82;
      if(t===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.globalAlpha=0.055;
    ctx.strokeStyle=col;
    ctx.stroke();
  }
  if(RM){
    peaks.forEach(p=>{ for(let i=0;i<rings;i++) ring(p,i); });
  }else{
    let shown=0;
    (function anim(){
      ctx.clearRect(0,0,w,h);
      peaks.forEach(p=>{ for(let i=0;i<=shown && i<rings;i++) ring(p,i); });
      shown++;
      if(shown<=rings) requestAnimationFrame(anim);
    })();
  }
}
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(drawContour,150); });

/* ---------- boot ---------- */
drawContour();
go("dashboard");
})();
</script>
