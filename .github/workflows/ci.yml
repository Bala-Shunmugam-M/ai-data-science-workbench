name: CI

# The project's central claim is that a run is reproducible from a clean
# checkout. This workflow is the evidence for that claim: it takes a bare clone
# on a machine that has never seen the project, runs the test suite, then runs
# the pipeline end to end on the sample data committed to the repository.
#
# No credentials are required. The Kaggle-backed projects need an API token, so
# CI deliberately uses the 600-row samples bundled in webapp/public/samples/ -
# the same files the web console offers as one-click demos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the test suite
        run: pytest -q

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Classification, end to end: ingest -> ... -> trust -> report.
      # The bridge is used rather than `main.py autorun` because autorun runs
      # whatever project is already active, whereas the bridge registers the
      # dataset and then runs it - which is what a fresh machine needs.
      - name: Run the churn pipeline on sample data
        run: |
          python webapi/bridge.py analyze \
            --csv webapp/public/samples/telco-churn-sample.csv \
            --name "Telco Churn CI" \
            --target Churn \
            --task classification \
            --positive-class Yes

      # Regression, end to end. Proves the same code path serves both tasks -
      # the architectural claim the project is built to demonstrate.
      - name: Run the housing pipeline on sample data
        run: |
          python webapi/bridge.py analyze \
            --csv webapp/public/samples/california-housing-sample.csv \
            --name "California Housing CI" \
            --target median_house_value \
            --task regression

      - name: Verify both runs produced a champion and a model card
        run: python .github/scripts/verify_ci_runs.py

      - name: Upload the generated reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            workspaces/*/artifacts/reports/
            workspaces/*/artifacts/trust/
          if-no-files-found: error
