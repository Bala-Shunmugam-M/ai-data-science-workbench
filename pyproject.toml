[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-science-workbench"
version = "0.1.0"
description = "Governed, reproducible end-to-end machine learning platform (California Housing showcase)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amrita School of Business - Machine Learning Team" }]
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "kagglehub",
    "pyyaml",
    "joblib",
    "streamlit",
    "pytest",
]

[project.scripts]
workbench = "main:main"

# Plain-folder (non-src) layout: packages live at the repository root.
[tool.setuptools]
packages = ["config", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
